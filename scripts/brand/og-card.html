<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card renderer</title>
<style>
@font-face{font-family:'InterCard';src:url('/fonts/inter-latin.woff2') format('woff2');font-weight:100 900;font-display:block}
html,body{margin:0;background:#111;color:#eee;font-family:-apple-system,sans-serif}
#card{display:block;max-width:100%;height:auto}
#status{padding:12px 16px;font-size:14px}
</style>
</head>
<body>
<canvas id="card" width="1200" height="630"></canvas>
<div id="status">rendering…</div>
<script>
// Renders the 1200×630 social card at exact device pixels, then POSTs the PNG
// back to the local render server. Run: node scripts/render-og.mjs
const W = 1200, H = 630;
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

async function render() {
  const fonts = [
    '600 30px InterCard',
    '500 30px InterCard',
    '800 82px InterCard',
    '600 21px InterCard',
    '800 21px InterCard',
  ];
  await Promise.all(fonts.map((f) => document.fonts.load(f)));
  await document.fonts.ready;

  // background: deep navy with a soft light pool top-right
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0b172f');
  g.addColorStop(0.58, '#14264a');
  g.addColorStop(1, '#0b172f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const pool = ctx.createRadialGradient(940, 60, 40, 940, 60, 620);
  pool.addColorStop(0, 'rgba(38, 74, 132, 0.55)');
  pool.addColorStop(1, 'rgba(11, 23, 47, 0)');
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);

  // faint scanlines — keeps the flat navy from looking dead
  ctx.fillStyle = 'rgba(255,255,255,0.028)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);

  // logo tile
  const mark = await loadImage('/assets/icon-512.png');
  const size = 196, x = 78, y = 168, r = 40;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 60;
  ctx.shadowOffsetY = 24;
  roundRect(ctx, x, y, size, size, r);
  ctx.fillStyle = '#0b172f';
  ctx.fill();
  ctx.restore();
  ctx.save();
  roundRect(ctx, x, y, size, size, r);
  ctx.clip();
  ctx.drawImage(mark, x, y, size, size);
  ctx.restore();

  // wordmark
  const tx = x + size + 44;
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 82px InterCard';
  ctx.fillStyle = '#ffffff';
  const word = 'Tools4Market';
  ctx.fillText(word, tx, 300);
  const wWidth = ctx.measureText(word).width;
  ctx.fillStyle = '#b8d92c';
  ctx.fillText('.', tx + wWidth, 300);

  // tagline
  ctx.font = '500 30px InterCard';
  ctx.fillStyle = '#b9c8de';
  ctx.fillText('Free marketing, SEO & AI-search tools', tx + 2, 356);

  // accent rule
  ctx.fillStyle = '#b8d92c';
  roundRect(ctx, tx + 2, 390, 132, 6, 3);
  ctx.fill();

  // pills
  const pills = [
    { label: '44', tail: 'tools' },
    { label: 'No signup', tail: '' },
    { label: 'Runs in your browser', tail: '' },
  ];
  ctx.font = '600 21px InterCard';
  let px = tx + 2;
  const py = 470, ph = 52;
  for (const p of pills) {
    ctx.font = '800 21px InterCard';
    const wLabel = ctx.measureText(p.label).width;
    ctx.font = '600 21px InterCard';
    const wTail = p.tail ? ctx.measureText(' ' + p.tail).width : 0;
    const pw = wLabel + wTail + 40;
    roundRect(ctx, px, py, pw, ph, ph / 2);
    ctx.fillStyle = 'rgba(184,217,44,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(184,217,44,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = '800 21px InterCard';
    ctx.fillStyle = '#b8d92c';
    ctx.fillText(p.label, px + 20, py + 34);
    if (p.tail) {
      ctx.font = '600 21px InterCard';
      ctx.fillStyle = '#dbe7c2';
      ctx.fillText(' ' + p.tail, px + 20 + wLabel, py + 34);
    }
    px += pw + 14;
  }

  const dataUrl = canvas.toDataURL('image/png');
  const bin = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const res = await fetch('/save', { method: 'POST', body: bytes });
  status.textContent = res.ok
    ? 'saved 1200×630 (' + Math.round(bytes.length / 1024) + ' KB)'
    : 'save failed: ' + res.status;
  document.title = res.ok ? 'OG_SAVED' : 'OG_FAILED';
}

render().catch((e) => {
  status.textContent = 'error: ' + e.message;
  document.title = 'OG_FAILED';
});
</script>
</body>
</html>
